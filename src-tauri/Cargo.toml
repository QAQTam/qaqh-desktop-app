[package]
name = "qaqh-webui-app"
version.workspace = true
edition = "2024"
description = "QAQ-Harness 桌面壳:Tauri 2 宿主,承载 webui 渲染层并以 sidecar 托管 daemon"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
axum = { version = "0.8" }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# 「选择工作区目录」的原生文件夹对话框(commands::pick_directory):webview
# 无文件系统面,目录只能由宿主侧挑,再把绝对路径回给渲染层。
tauri-plugin-dialog = "2"
log = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
window-vibrancy = "0.8"
qaqh-client = { path = "../../qaqh-backend/crates/qaqh-client" }
qaqh-types = { path = "../../qaqh-backend/crates/qaqh-types" }
# 壳自己的内存计数(`commands::host_memory`)复用 daemon 那份 psapi/procfs 实现,
# 两边 DTO 同形——前端才能把「壳」与「daemon」两行拼进同一张表。只依赖 serde。
qaqh-memwatch = { path = "../../qaqh-backend/crates/qaqh-memwatch" }
# 设备配对(pairing.rs)直连 daemon 的 ringing v2 HTTPS 面;特性集与
# qaqh-client 保持一致(rustls-no-provider + 进程内 ring provider),
# 避免拖第二套 TLS 栈进产物。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# 界面进程组(`procgroup.rs`):要问 WebView2 引擎「你起了哪些进程、各是什么角色」,
# 就得用它的接口类型,而 tauri 不 re-export `webview2_com`。`windows-core` 只为
# `Interface::cast`(两者都已在依赖图里,不新增下载)。
[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# mac 的界面进程组(`procgroup.rs`):`proc_listchildpids` / `proc_pidpath` /
# `proc_pid_rusage` + `rusage_info_v4` 都在 libc 里声明好了,所以不用手写
# 结构体布局(那正是最容易把字段偏移记错的地方)。libc 已在依赖图里,不新增下载。
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[lints]
workspace = true
